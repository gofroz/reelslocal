<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="referrer" content="no-referrer"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Retorno ao ReelsLocal</title><style>body{font:18px system-ui;background:#101827;color:#e8f5f0;max-width:600px;margin:80px auto;padding:24px}a{color:#69e5c0}</style><h1>Voltando ao ReelsLocal</h1><p id="status">Validando o retorno do Instagram…</p><script>
const params=new URLSearchParams(location.search);history.replaceState(null,'',location.pathname);const state=params.get('state');if(!/^[a-f0-9]{64}$/.test(state||'')||!params.get('code')&&!params.get('error')){document.getElementById('status').textContent='Retorno inválido. Inicie o login pelo ReelsLocal.';}else{const back=new URL('http://127.0.0.1:4317/api/instagram/callback');back.searchParams.set('state',state);if(params.get('code'))back.searchParams.set('code',params.get('code'));else back.searchParams.set('error','access_denied');document.getElementById('status').textContent='O ReelsLocal precisa estar aberto neste computador. Retornando…';location.replace(back.href);}
</script></html>
